summary: >-
  Every Helloworld host probed negotiates TLS 1.3 and every one except expresstickets.com.au
  returns HSTS with a one-year max-age. Email authentication is uneven across the estate: the
  four brand domains that sit in front of travellers and agents (helloworld.com.au,
  readyrooms.com.au, airtickets.com.au, expresstickets.com.au) all publish SPF and a delegated
