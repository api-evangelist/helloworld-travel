  publishes SPF but NO DMARC at all, and aotonline.net — the inbound trade booking engine —
  publishes neither SPF nor DMARC. No domain in the estate is DNSSEC-signed. CAA is published
  on three of six domains. Absence of a record is recorded here as data, not as an error.
