summary: >-
  No /.well-known/ discovery document of any kind is published anywhere in the Helloworld Travel
  Limited estate. Ten hosts were probed for security.txt, openid-configuration,
  oauth-authorization-server, oauth-protected-resource, api-catalog, ai-plugin.json, llms.txt,
  openapi.json and swagger.json. Every result is a hard 404, a 401 Basic-auth challenge, a 403
  edge block, or a soft 404 — an HTTP 200 carrying the site's own HTML error page or an empty
  body. Soft 404s are called out explicitly below because three hosts in this estate answer 200
  for literally any path: www.helloworld.com.au redirects every unknown path to
  /global/404?default, www.airtickets.com.au returns 200 with a zero-byte body, and
  www.aotonline.net returns its 43KB template page. Every such 200 was byte-compared against a
  control request for an invented path on the same host, and matched. The only genuinely served
  discovery file found anywhere in the estate is the robots.txt on the AOTonline trade booking
  engine, saved verbatim alongside this index. Absence is the finding, and it is consistent with
  the closed API posture recorded in review.yml.
