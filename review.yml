artifacts:
  openapi: []
  asyncapi: []
  postman: []
  graphql: []
  note: nothing machine-readable was found, so no openapi/ directory was created. The
    only JSON namespace on any Helloworld property is the generic WordPress
    /wp-json/contact-form-7/v1 endpoint on the corporate site, which is CMS
    infrastructure rather than a product API and is deliberately not listed.
actions:
  apisYmlCreated: true
  apisListed: 0
  reason: |
    apis[] is empty because Helloworld Travel Limited publishes no documented public
    API. Listing an agent login page as an API would be fabrication. The bootstrap
    records identity, the real trade surfaces and their gates, and the switching-cost
    evidence, and leaves apis[] empty until Helloworld publishes a contract.
