source: >-
  Helloworld Travel Limited corporate site, policy host and trade portals, searched and probed
  2026-07-28
summary: >-
  Helloworld publishes no API lifecycle at all — no versioning scheme, no deprecation policy, no
  Sunset or Deprecation header contract, no SLA or uptime commitment, no API changelog and no
  status page. That is the expected consequence of having no public API: there is no versioned
  contract for a lifecycle to govern. What Helloworld does publish, as an ASX-listed entity, is a
  corporate disclosure lifecycle — continuous disclosure through ASX announcements, half-year and
  full-year results, and annual reports — governed by a Continuous Disclosure Policy and a
  Shareholder Communications Policy. That is the only dated, obligation-backed change feed the
  group operates, and it is recorded here so the absence on the API side is not confused with an
  absence of governance generally. A partner integrating with ReadyRooms, AOTonline, Air Tickets
  or Express Tickets has no published notice period, no change log and no deprecation commitment
  to rely on; change is communicated through the trade relationship.
